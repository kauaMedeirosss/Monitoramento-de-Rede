services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    ports:
      - "9090:9090"
    restart: always
    networks:
      - monitoramento
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=10GB'
    volumes:
      - ./diretorios/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./dados_prometheus:/prometheus

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox_exporter
    ports:
      - "9115:9115"
    restart: always
    networks:
      - monitoramento
    volumes:
      - ./diretorios/blackbox.yml:/etc/prometheus/blackbox.yml

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: always
    network_mode: "host"                           
    pid: "host"
    volumes:
      - '/:/host:ro,rslave'
    command:
      - '--path.rootfs=/host'
      - '--collector.wifi'

  speedtest:
    image: miguelndecarvalho/speedtest-exporter:v3.5.4
    container_name: speedtest
    ports:
      - "9798:9798"
    restart: always
    networks:
      - monitoramento

  grafana:
    image: grafana/grafana:9.5.15
    container_name: grafana
    ports:
      - "3000:3000"
    restart: always
    networks:
      - monitoramento
    volumes:
      - ./diretorios/grafana-provisioning:/etc/grafana/provisioning/
    environment:
      - GF_SECURITY_ADMIN_USER=lcade
      - GF_SECURITY_ADMIN_PASSWORD=lcade
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/Monitoramento.json
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=volkovlabs-echarts-panel

networks:
  monitoramento:
    driver: bridge

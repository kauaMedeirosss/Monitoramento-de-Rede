# ==============================================================================
# 1. CONFIGURAÇÃO GERAL DO AGENTE
# ==============================================================================
[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000

# ==============================================================================
# 2. SAÍDA DE DADOS (INFLUXDB V2)
# ==============================================================================
[[outputs.influxdb_v2]]
  urls = ["http://192.168.0.104:8086"] # Substitua pelo IP real da sua máquina
  token = "7eWkP2R9xT4vLzQmJnYb8uCsK1wFaGhEjNdXyZpAqUr5tVwPx3oMiLvK9cDsBfGt"
  organization = "LCADE"
  bucket = "Monitoramento"

# ==============================================================================
# 3. COLETA DE HARDWARE INTERNO E REDE FÍSICA
# ==============================================================================
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.net]]

# ==============================================================================
# 4. INTENSIDADE DO SINAL WIFI
# ==============================================================================
[[inputs.wireless]]

# ==============================================================================
# 5. TESTE DE BANDA (SPEEDTEST)
# ==============================================================================
[[inputs.internet_speed]]
  interval = "30m" 
  memory_saving_mode = false

# ==============================================================================
# 6. LATÊNCIA E MICRO INTERRUPÇÕES (IPv4)
# ==============================================================================
[[inputs.ping]]
  urls = ["8.8.8.8", "192.168.0.1"] 
  interval = "5s" 
  count = 1
  timeout = 2.0
  ipv6 = false
  [inputs.ping.tags]
    proto = "ipv4"

# ==============================================================================
# 7. CONECTIVIDADE EXTERNA (IPv6)
# ==============================================================================
[[inputs.ping]]
  urls = ["2001:4860:4860::8888"] # Servidor DNS Google IPv6
  interval = "5s"
  count = 1
  timeout = 2.0
  ipv4 = false
  [inputs.ping.tags]
    proto = "ipv6"

# ==============================================================================
# 8. RESOLUÇÃO DE NOMES E TEMPO DNS (IPv4 e IPv6)
# ==============================================================================
# Consulta Registro A (IPv4)
[[inputs.dns_query]]
  servers = ["192.168.0.1"] # O IP do seu roteador/DNS local
  domains = ["sigaa.ufpa.br", "mppa.mp.br"]
  record_type = "A"
  interval = "30s"
  [inputs.dns_query.tags]
    proto = "ipv4"

# Consulta Registro AAAA (IPv6)
[[inputs.dns_query]]
  servers = ["192.168.0.1"]
  domains = ["sigaa.ufpa.br", "mppa.mp.br"]
  record_type = "AAAA"
  interval = "30s"
  [inputs.dns_query.tags]
    proto = "ipv6"

# ==============================================================================
# 9. DISPONIBILIDADE DE SERVIÇOS (Fluxos TCP/UDP)
# ==============================================================================
# Testa se a porta do servidor Web está aberta e o tempo de resposta
[[inputs.net_response]]
  protocol = "tcp"
  address = "sigaa.ufpa.br:443"
  timeout = "2s"
  interval = "30s"
  
# ==============================================================================
# 10. ANÁLISE DE FAILOVER (MUDANÇA DE IP PÚBLICO)
# ==============================================================================
[[inputs.http]]
  ## Consulta um serviço externo para descobrir o IP pelo qual a rede está a sair
  urls = ["https://api.ipify.org"]
  method = "GET"
  timeout = "5s"
  interval = "60s"
  
  ## Como o site devolve apenas texto puro (ex: "189.10.20.30"), configuramos como string
  name_override = "failover_status"
  data_format = "value"
  data_type = "string"
